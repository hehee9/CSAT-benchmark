[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csat-benchmark"
version = "0.1.0"
description = "Configurable Korean CSAT LLM benchmark foundations"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.1.1",
    "pillow>=12.2.0",
]

[tool.setuptools.packages.find]
include = ["csat_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
